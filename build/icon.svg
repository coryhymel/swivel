<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f0"/>
      <stop offset="1" stop-color="#1557b0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b2a5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <!-- Three accounts, stacked: the front one is the active account. -->
  <rect x="104" y="44" width="104" height="112" rx="18" fill="#f9ab00" filter="url(#shadow)"/>
  <rect x="78" y="72" width="104" height="112" rx="18" fill="#34a853" filter="url(#shadow)"/>
  <g filter="url(#shadow)">
    <rect x="52" y="100" width="104" height="112" rx="18" fill="#ffffff"/>
  </g>
  <rect x="70" y="124" width="40" height="12" rx="6" fill="#1a73e8"/>
  <rect x="70" y="148" width="68" height="10" rx="5" fill="#c6d4ea"/>
  <rect x="70" y="168" width="54" height="10" rx="5" fill="#c6d4ea"/>
</svg>
